<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作品集</title>
  <link rel="stylesheet" href="portal/style.css?v=8">
</head>
<body>
  <div class="page">
    <header class="hero">
      <p class="eyebrow" id="count" hidden></p>
      <h1 id="site-title">加载中</h1>
      <p class="subtitle" id="site-subtitle"></p>
    </header>

    <div class="toolbar" id="toolbar" hidden>
      <label class="search">
        <span class="sr-only">搜索子网页</span>
        <input id="search" type="search" placeholder="搜索名称、简介或标签" autocomplete="off">
      </label>
      <div class="filters" id="filters" hidden></div>
    </div>

    <main>
      <p class="status" id="status">正在读取项目清单…</p>
      <section class="grid" id="grid" hidden></section>
    </main>

    <footer class="footer">
      <p>把构建产物放到 <code>apps/&lt;目录&gt;/</code>，并在 <code>apps.json</code> 里登记 <code>folder</code> 与 <code>name</code>。</p>
    </footer>
  </div>
  <script type="module" src="portal/app.js?v=8"></script>
</body>
</html>
